name: Labeler

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issues:
    types: [opened, edited]

concurrency:
  group: labeler-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Auto-label
    runs-on: ubuntu-latest
    if: github.repository_owner == 'coccinella-labs'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ELLIS_APP_ID }}
          private-key: ${{ secrets.ELLIS_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Apply labels
        uses: actions/labeler@v6
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          configuration-path: .github/labeler.yml
          sync-labels: true