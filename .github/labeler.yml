# Label configuration for PRs and issues.
# Used by .github/workflows/labeler.yml to auto-apply labels based on
# changed file paths and PR metadata.
#
# Format: actions/labeler v5+ match objects. Each label maps to a list of
# match rules; a rule matches when ANY of its options match (OR-ed), and
# multiple rules for a label are OR-ed together. The `size:small` and
# `size:medium` labels are applied by .github/workflows/size.yml based on
# added/deleted lines and file counts, so they are intentionally absent here
# (the labeler no longer supports the legacy `changed-files:<=N` syntax).

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"
          - "README.md"

frontend:
  - changed-files:
      - any-glob-to-any-file: "apps/client/**"

backend:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/server/**"
          - "api/**"

cli:
  - changed-files:
      - any-glob-to-any-file: "apps/cli/**"

shared:
  - changed-files:
      - any-glob-to-any-file: "packages/shared/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "package-lock.json"
          - "apps/cli/package.json"
          - "apps/cli/package-lock.json"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/labeler.yml"

test:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.test.*"
          - "**/*.spec.*"
          - "tests/**"

config:
  - changed-files:
      - any-glob-to-any-file:
          - ".releaserc.json"
          - "vitest.config.ts"
          - "tsconfig*.json"
          - "eslint.config.js"
          - "commitlint.config.js"

docker:
  - changed-files:
      - any-glob-to-any-file:
          - "Dockerfile"
          - "docker/**"